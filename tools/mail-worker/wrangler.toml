name = "odysseus-mail"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# Where each message is also forwarded. It must be a verified destination
# address under Email > Email Routing > Destination addresses.
FORWARD_TO = ""

[[r2_buckets]]
binding = "MAIL"
bucket_name = "odysseus-mail"

# PULL_SECRET is a secret, not a var: npx wrangler secret put PULL_SECRET
